[tool.pytest.ini_options]
# `tests` is the fast suite: it never imports Home Assistant and parses the
# component with `ast`. `tests_ha` runs against a real Home Assistant.
# They are separate invocations because the fast suite installs fake
# `homeassistant` modules into sys.modules and does not remove them.
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Lint
        run: mise exec pipx:ruff -- ruff check custom_components tests
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/orion_sleep/manifest.json >/dev/null
          python -m json.tool custom_components/orion_sleep/strings.json >/dev/null
          python -m json.tool custom_components/orion_sleep/translations/en.json >/dev/null
      - name: Test
        run: mise exec pipx:pytest -- pytest -q

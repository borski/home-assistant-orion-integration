name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint and compile only. Kept as its own job with no Home Assistant
  # install so that a syntax error or an import-order slip reports in
  # seconds rather than after a dependency resolve.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Lint
        run: mise exec pipx:ruff -- ruff check custom_components tests tests_ha
      - name: Compile
        run: python -m compileall -q custom_components tests tests_ha
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/orion_sleep/manifest.json >/dev/null
          python -m json.tool custom_components/orion_sleep/strings.json >/dev/null
          python -m json.tool custom_components/orion_sleep/translations/en.json >/dev/null

  # The fast suite. This job used to install nothing, and the suite
  # parsed the component with `ast` because it could not import it. That
  # meant a missing library symbol, a renamed Home Assistant helper, or a
  # platform that raised on import all passed it green, which is the exact
  # class of breakage most likely to ship after the API client was
  # extracted into its own package.
  #
  # It now installs the test dependency group and imports the integration
  # for real. The suite still runs in under a second, because the Home
  # Assistant import is paid once per process rather than per test.
  #
  # The two checks that used to live here as inline `python - <<'PY'`
  # heredocs, "import every platform" and "every client symbol resolves",
  # are now real tests in tests/test_package_imports.py. A check written
  # in a YAML heredoc cannot be run locally, is not counted in any total,
  # and has no name when it fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # orion-sleep-api is installed separately rather than from the
      # `test` group, so the version CI resolves is the one manifest.json
      # actually pins. Putting it in the group would let the two drift
      # and `tests/test_package_imports.py` would be asserting against a
      # build Home Assistant never installs.
      - name: Build the test environment
        run: |
          uv venv .venv-ha --python 3.14
          uv pip install --python .venv-ha --group test
          PIN=$(python -c "import json,re; r=json.load(open('custom_components/orion_sleep/manifest.json'))['requirements']; print(next(x for x in r if x.startswith('orion-sleep-api')))")
          uv pip install --python .venv-ha "$PIN"
      # `-p no:homeassistant` is required. pytest autoloads
      # pytest-homeassistant-custom-component by entry point, and its
      # autouse async fixtures make every synchronous test in the fast
      # suite error at setup. tests/conftest.py fails loudly and names
      # this flag if it is missing.
      - name: Fast suite
        run: .venv-ha/bin/python -m pytest -q -p no:homeassistant

  # The real Home Assistant suite. Builds a Home Assistant instance per
  # test, so it is about 130 seconds rather than one, and it runs as its
  # own job so a failure here is distinguishable from a fast-suite
  # failure at a glance.
  #
  # This suite previously did not run in CI at all. 233 tests existed and
  # were local-only, which meant the checks with the most behavioural
  # coverage in the repository were the ones least likely to be run
  # before a merge.
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Same blocker as the `test` job above.
      - name: Build the test environment
        run: |
          uv venv .venv-ha --python 3.14
          uv pip install --python .venv-ha --group test
          PIN=$(python -c "import json,re; r=json.load(open('custom_components/orion_sleep/manifest.json'))['requirements']; print(next(x for x in r if x.startswith('orion-sleep-api')))")
          uv pip install --python .venv-ha "$PIN"
      - name: Real Home Assistant suite
        run: .venv-ha/bin/python -m pytest tests_ha -q

# Cuts a GitHub release whenever custom_components/orion_sleep/manifest.json
# names a version that has no release yet. HACS reads GitHub releases, so this
# is what makes a version bump installable rather than only a moving main.
#
# Adopted from Kevin Klaes's fork, which added exactly this. The mechanism
# (read the manifest version, tag it, skip if the tag already exists) is his.
#
# The decision is "does a release for the manifest version already exist?",
# NOT "did the tip commit change the version". An earlier form compared the
# manifest against HEAD~1 and filtered on `paths:`, which meant a squash or a
# rebase that left the version bump in any commit other than the literal tip
# silently skipped the release. Keying off the existing releases instead is
# order-independent: however the commit that carries the bump arrives on
# main, the first push that lands it with no matching release cuts one, and
# every later push is a no-op because the release already exists.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the manifest version
        id: version
        run: |
          CURRENT=$(jq -r '.version' custom_components/orion_sleep/manifest.json)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"

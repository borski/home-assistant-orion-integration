override_schedule:
  target:
    entity:
      integration: orion_sleep
      domain: time
  fields:
    bedtime:
      required: false
      example: "23:30"
      selector:
        time:
    wakeup:
      required: false
      example: "07:30"
      selector:
        time:
    bedtime_temp_offset:
      required: false
      example: -3
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    phase_1_temp_offset:
      required: false
      example: -6
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    phase_2_temp_offset:
      required: false
      example: -4
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    wakeup_temp_offset:
      required: false
      example: 2
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    bedtime_is_active:
      required: false
      selector:
        boolean:
    wakeup_is_active:
      required: false
      selector:
        boolean:
    auto_turn_off:
      required: false
      selector:
        boolean:
    is_smart_temperature_active:
      required: false
      selector:
        boolean:

start_cooling:
  target:
    entity:
      integration: orion_sleep
      domain: climate
  fields:
    duration_minutes:
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box

stop_cooling:
  target:
    entity:
      integration: orion_sleep
      domain: climate

list_sleep_sessions:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    limit:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box

delete_sleep_session:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    session_id:
      required: true
      example: "0199f3c1-0000-0000-0000-000000000000"
      selector:
        text:
    reason:
      required: true
      default: not_real_session
      selector:
        select:
          options:
            - not_real_session
            - no_longer_needed
    confirm:
      required: true
      default: false
      selector:
        boolean:

confirm_sleep_session:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    session_id:
      required: true
      selector:
        text:
    claim:
      default: me
      selector:
        select:
          options:
            - value: me
              label: This person
            - value: both
              label: Both sleepers

edit_sleep_session:
  name: Edit sleep session
  description: >-
    Move a recorded session's start and end. The bed reanalyses the whole
    night afterwards, so sleep stages, heart rate, breathing and apnea are
    recomputed rather than simply relabelled. Reversible: run it again with
    the original times to restore the previous numbers exactly. Target one
    of the sleeper's insight sensors to say whose session this is.
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    session_id:
      name: Session ID
      description: From orion_sleep.list_sleep_sessions.
      required: true
      selector:
        text:
    fell_asleep:
      name: Fell asleep
      description: When sleep actually started. Local time.
      required: true
      selector:
        datetime:
    woke_up:
      name: Woke up
      description: When sleep actually ended. Local time.
      required: true
      selector:
        datetime:

end_sleep_session:
  name: End sleep session
  description: >-
    Stop the sleep session the bed currently thinks is running. Use this
    when the topper has decided someone is asleep who is not. Ends
    whatever session is open for the account behind the targeted entity.
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    confirm:
      name: Confirm
      description: >-
        Must be true. This is not aimed at a specific night, it ends
        whichever session is currently open.
      required: true
      selector:
        boolean:

list_access:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields: {}

list_invites:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields: {}

invite_user:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    phone_number:
      required: true
      example: "+1 415 555 1234"
      selector:
        text:
    role:
      required: true
      default: guest
      selector:
        select:
          options:
            - guest
            - member

cancel_invite:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    invite_id:
      required: true
      selector:
        text:

accept_invite:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    code:
      required: true
      selector:
        text:

remove_user_access:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    user_id:
      required: true
      selector:
        text:
    confirm:
      required: true
      default: false
      selector:
        boolean:

create_guest:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields: {}

update_user_phone:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    user_id:
      required: true
      selector:
        text:
    phone:
      required: true
      example: "+1 415 555 1234"
      selector:
        text:

assign_zones:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    user_id:
      required: true
      selector:
        text:
    zone_ids:
      required: true
      example: "[zone_a]"
      selector:
        object:
    confirm:
      name: Confirm
      description: Must be true. Assigning an occupied zone displaces its sleeper.
      required: true
      default: false
      selector:
        boolean:

set_device_name:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    name:
      required: true
      selector:
        text:

set_device_timezone:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    timezone:
      required: true
      example: America/Los_Angeles
      selector:
        text:

revert_unique_ids:
  name: Prepare entity ids for a 2.x downgrade
  description: >-
    Unload one Orion entry, restore its pre-3.0 entity and config-entry
    identities, and leave it unloaded. Run this while 3.x is still
    installed, then install 2.x before restarting Home Assistant.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: orion_sleep
    confirm:
      name: Confirm
      description: Must be true. The entry remains unloaded for downgrade.
      required: true
      default: false
      selector:
        boolean:

resume_unique_ids:
  name: Resume Orion 3.x after downgrade preparation
  description: >-
    Cancel recovery mode and load the entry under 3.x again. The forward
    migration reapplies account-keyed identities after collision checks.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: orion_sleep
    confirm:
      name: Confirm
      description: Must be true. Account-keyed identities will be restored.
      required: true
      default: false
      selector:
        boolean:

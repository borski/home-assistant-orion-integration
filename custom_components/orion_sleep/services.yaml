override_schedule:
  target:
    entity:
      integration: orion_sleep
      domain: time
  fields:
    bedtime:
      required: false
      example: "23:30"
      selector:
        time:
    wakeup:
      required: false
      example: "07:30"
      selector:
        time:
    bedtime_temp_offset:
      required: false
      example: -3
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    phase_1_temp_offset:
      required: false
      example: -6
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    phase_2_temp_offset:
      required: false
      example: -4
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    wakeup_temp_offset:
      required: false
      example: 2
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: slider
    bedtime_is_active:
      required: false
      selector:
        boolean:
    wakeup_is_active:
      required: false
      selector:
        boolean:
    auto_turn_off:
      required: false
      selector:
        boolean:
    is_smart_temperature_active:
      required: false
      selector:
        boolean:

start_cooling:
  target:
    entity:
      integration: orion_sleep
      domain: climate
  fields:
    duration_minutes:
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box

stop_cooling:
  target:
    entity:
      integration: orion_sleep
      domain: climate

list_sleep_sessions:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    limit:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box

delete_sleep_session:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    session_id:
      required: true
      example: "0199f3c1-0000-0000-0000-000000000000"
      selector:
        text:
    reason:
      required: true
      default: not_real_session
      selector:
        select:
          options:
            - not_real_session
            - no_longer_needed
    confirm:
      required: true
      default: false
      selector:
        boolean:

confirm_sleep_session:
  target:
    entity:
      integration: orion_sleep
      domain: sensor
  fields:
    session_id:
      required: true
      selector:
        text:
    claim:
      default: me
      selector:
        select:
          options:
            - value: me
              label: This person
            - value: both
              label: Both sleepers
